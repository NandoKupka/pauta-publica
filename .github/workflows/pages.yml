name: Publicar Pauta Pública

on:
  push:
    branches: [main]
  workflow_dispatch:
  public:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.visibility == 'public' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verificar o projeto
        run: npm test
      - name: Restaurar o histórico do coletor
        run: node scripts/pages-state.mjs restore
      - name: Consultar fontes oficiais
        id: collect
        timeout-minutes: 15
        continue-on-error: true
        run: node collect.mjs
      - name: Preservar histórico entre publicações
        run: node scripts/pages-state.mjs save
      - name: Gerar páginas estáticas
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:pages
      - name: Verificar links e recursos da publicação
        run: node scripts/check-pages.mjs
      - name: Registrar consultas parciais
        if: steps.collect.outcome != 'success'
        run: echo 'A coleta teve falhas. A publicação preserva a última cópia disponível e informa a idade dos dados.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    if: github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
